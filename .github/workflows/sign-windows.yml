name: Sign for Windows

# Signs a release's Windows programs and libraries (.exe, .dll) as Gregory Beam,
# with QSO Graph's one Azure Artifact Signing account, the same identity QSO Graph
# Desktop signs with (qso-graph/.github#47). Called by a product repository's
# release workflow:
#
#   sign-windows:
#     needs: build
#     uses: qso-graph/.github/.github/workflows/sign-windows.yml@<commit>
#     with: { artifact: qgt-windows-unsigned, signed: qgt-windows }
#     secrets: inherit
#
# The caller's windows-signing Environment holds the three Azure IDs, and Azure
# trusts GitHub's own token for that Environment of that repository alone, so no
# credential is held anywhere. The Environment's branch rule (main) is the lock;
# this workflow also refuses any other ref, so a refusal says why.

on:
  workflow_call:
    inputs:
      artifact:
        description: The unsigned files, as an Actions artifact uploaded by the caller
        type: string
        required: true
      signed:
        description: The artifact name to upload the signed files under
        type: string
        required: true

permissions:
  contents: read

jobs:
  sign:
    name: Sign (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      # GitHub's token, which Azure trusts for this Environment.
      id-token: write
    steps:
      - name: Only main signs
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "Signing runs from main only, not $REF." >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: files

      # The three IDs name an Azure app, directory and subscription; kept as the
      # Environment's secrets so they stay masked in a public repository's logs.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The account, profile and endpoint are QSO Graph Desktop's (its ci.yml):
      # names, not secrets.
      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: qsographsigning
          certificate-profile-name: qso-graph
          files-folder: ${{ github.workspace }}\files
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          # Timestamped by Microsoft's own service, the action's default, so a
          # signature stays valid after the certificate's short life ends.
          timestamp-digest: SHA256

      # What Windows will say: every program and library validly signed, by
      # Gregory Beam. None found is a failure, never a pass.
      - name: Signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse files -Include *.exe,*.dll)
          if ($files.Count -eq 0) { throw "No .exe or .dll in the artifact: nothing was signed." }
          $bad = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $subject = $signature.SignerCertificate.Subject
            Write-Output "$($file.Name): $($signature.Status), $subject"
            if ($signature.Status -ne 'Valid') { Write-Output "::error::$($file.Name) is not validly signed: $($signature.StatusMessage)"; $bad++; continue }
            if ($subject -notmatch '(^|, )CN=Gregory Beam(,|$)') { Write-Output "::error::$($file.Name) is signed by someone else: $subject"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) not signed as Gregory Beam." }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.signed }}
          path: files
          if-no-files-found: error
