name: Public repository conformance

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the rules
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Install Vale
        run: |
          version=3.26.0
          archive="vale_${version}_Linux_64-bit.tar.gz"
          # The archive's SHA-256, pinned here: a checksum fetched beside the archive would prove only
          # that both came from the same place.
          sha256=22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed
          base="https://github.com/errata-ai/vale/releases/download/v${version}"
          curl -fsSLO "$base/$archive"
          echo "$sha256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale sync
      - name: Report conformance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Enforcing since every public repository conformed (2026-11-08): the table always reaches the
        # job summary, then any finding fails the run (--strict exits 10), so drift shows as a red check.
        run: |
          status=0
          python scripts/conformance.py --strict > report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
          exit "$status"
