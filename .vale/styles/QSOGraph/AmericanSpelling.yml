# QSO Graph writes American English (TEMPLATES.md, "Style"). Google's Vale package has no spelling
# rule, so British spellings would pass unseen; this names the ones that have reached our pages.
extends: substitution
message: "Use American spelling: '%s', not '%s'."
level: error
ignorecase: true
swap:
  licence: license
  licences: licenses
  licenced: licensed
  kilometre: kilometer
  kilometres: kilometers
  centimetre: centimeter
  centimetres: centimeters
  metre: meter
  metres: meters
  behaviour: behavior
  behaviours: behaviors
  colour: color
  colours: colors
  favour: favor
  honour: honor
  neighbour: neighbor
  neighbours: neighbors
  organisation: organization
  organisations: organizations
  organise: organize
  organised: organized
  recognise: recognize
  recognised: recognized
  realise: realize
  realised: realized
  summarise: summarize
  summarised: summarized
  prioritise: prioritize
  authorise: authorize
  authorised: authorized
  initialise: initialize
  initialised: initialized
  normalise: normalize
  normalised: normalized
  analyse: analyze
  analysed: analyzed
  catalogue: catalog
  catalogues: catalogs
  centre: center
  centres: centers
  defence: defense
  modelling: modeling
  modelled: modeled
  travelling: traveling
  grey: gray
  whilst: while
